version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatspulse_app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://whatspulse:whatspulse_secret_2026@wp_db:5432/whatspulse?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://wp_redis:6379}
      - JWT_SECRET=${JWT_SECRET:-whatspulse-super-jwt-secret-cakirlar-2026}
      - APP_URL=${APP_URL:-https://mesaj.cakirlar.net}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://10.0.201.201:3800}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-ff}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-42A33C177D1A-4165-8F1D-0C6491AA85DD7DE66D9}
      - EVOLUTION_GLOBAL_KEY=${EVOLUTION_GLOBAL_KEY:-16f54b4d7f24e095e8e88761f3bc993d863cafced9d6f99939824d28a206726a}
    expose:
      - '3000'
    depends_on:
      wp_db:
        condition: service_healthy
      wp_redis:
        condition: service_healthy
    networks:
      - whatspulse-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.whatspulse.rule=Host(`mesaj.cakirlar.net`)"
      - "traefik.http.routers.whatspulse.entrypoints=https,websecure,http,web"
      - "traefik.http.routers.whatspulse.tls=true"
      - "traefik.http.routers.whatspulse.tls.certresolver=letsencrypt"
      - "traefik.http.services.whatspulse.loadbalancer.server.port=3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: whatspulse_worker
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://whatspulse:whatspulse_secret_2026@wp_db:5432/whatspulse?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://wp_redis:6379}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://10.0.201.201:3800}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-ff}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-42A33C177D1A-4165-8F1D-0C6491AA85DD7DE66D9}
      - EVOLUTION_GLOBAL_KEY=${EVOLUTION_GLOBAL_KEY:-16f54b4d7f24e095e8e88761f3bc993d863cafced9d6f99939824d28a206726a}
    depends_on:
      wp_db:
        condition: service_healthy
      wp_redis:
        condition: service_healthy
    networks:
      - whatspulse-network

  wp_db:
    image: postgres:16-alpine
    container_name: whatspulse_postgres
    restart: always
    environment:
      POSTGRES_USER: whatspulse
      POSTGRES_PASSWORD: whatspulse_secret_2026
      POSTGRES_DB: whatspulse
    volumes:
      - whatspulse_pgdata_v1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatspulse -d whatspulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - whatspulse-network

  wp_redis:
    image: redis:7-alpine
    container_name: whatspulse_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - whatspulse_redis_data_v1:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - whatspulse-network

volumes:
  whatspulse_pgdata_v1:
  whatspulse_redis_data_v1:

networks:
  whatspulse-network:
    driver: bridge
  coolify:
    external: true
